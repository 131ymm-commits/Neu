<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 760 476" role="img" aria-label="Богатство течёт по кругу: рента кормит всех, излишек становится славой" font-size="13"><rect width="760" height="476" fill="#ffffff"/><defs><marker id="eco-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Богатство течёт по кругу: рента кормит всех, излишек становится славой</text><g><rect x="24" y="56" width="712" height="116" rx="8" fill="#f1f3f6"></rect><rect x="24" y="196" width="712" height="116" rx="8" fill="#f1f3f6"></rect><rect x="24" y="336" width="712" height="116" rx="8" fill="#f1f3f6"></rect></g><text x="36" y="74" font-size="11.5" fill="#57606a">Потолок: излишек превращается в славу</text><text x="36" y="214" font-size="11.5" fill="#57606a">Агора: свободный рынок хоров</text><text x="724" y="354" text-anchor="end" font-size="11.5" fill="#57606a">Мойра: никто не падает ниже доли</text><g fill="none" stroke="#8a8f98" stroke-width="1.25"><path d="M148 364V298" marker-end="url(#eco-arrow)"></path><path d="M420 296V362" marker-end="url(#eco-arrow)"></path><path d="M420 224V158" marker-end="url(#eco-arrow)"></path><path d="M334 400H236" marker-end="url(#eco-arrow)"></path><path d="M234 260H332" marker-end="url(#eco-arrow)"></path><path d="M334 120H236" marker-end="url(#eco-arrow)"></path><path d="M554 260H508" marker-end="url(#eco-arrow)"></path></g><text x="156" y="334" font-size="11.5" fill="#57606a">каждый может пробовать</text><text x="428" y="334" font-size="11.5" fill="#57606a">налог антидосиса</text><text x="428" y="194" font-size="11.5" fill="#57606a">сверх порога Платона</text><text x="284" y="392" text-anchor="middle" font-size="11.5" fill="#57606a">рента</text><text x="284" y="252" text-anchor="middle" font-size="11.5" fill="#57606a">прибыль</text><text x="284" y="112" text-anchor="middle" font-size="11.5" fill="#57606a">имя на камне</text><g><rect x="62" y="84" width="172" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="148" y="108" text-anchor="middle" font-weight="600" fill="#1f2328">Слава</text><text x="148" y="126" text-anchor="middle" font-size="11.5" fill="#1f2328">венки, надписи, песни</text><text x="148" y="142" text-anchor="middle" font-size="11.5" fill="#1f2328">не продаётся</text></g><g><rect x="334" y="84" width="172" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="420" y="108" text-anchor="middle" font-weight="600" fill="#1f2328">Литургии</text><text x="420" y="126" text-anchor="middle" font-size="11.5" fill="#1f2328">звездолёты, праздники,</text><text x="420" y="142" text-anchor="middle" font-size="11.5" fill="#1f2328">больницы, наука</text></g><g><rect x="62" y="224" width="172" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="148" y="248" text-anchor="middle" font-weight="600" fill="#1f2328">Хоры на Агоре</text><text x="148" y="266" text-anchor="middle" font-size="11.5" fill="#1f2328">люди, даймоны и</text><text x="148" y="282" text-anchor="middle" font-size="11.5" fill="#1f2328">треножники в деле</text></g><g><rect x="334" y="224" width="172" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="420" y="248" text-anchor="middle" font-weight="600" fill="#1f2328">Дело</text><text x="420" y="266" text-anchor="middle" font-size="11.5" fill="#1f2328">доли, мастерские,</text><text x="420" y="282" text-anchor="middle" font-size="11.5" fill="#1f2328">свои треножники</text></g><g><rect x="554" y="224" width="172" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="640" y="248" text-anchor="middle" font-weight="600" fill="#1f2328">Остракизм</text><text x="640" y="266" text-anchor="middle" font-size="11.5" fill="#1f2328">раз в год: контроль</text><text x="640" y="282" text-anchor="middle" font-size="11.5" fill="#1f2328">уходит на 10 лет</text></g><g><rect x="62" y="364" width="172" height="72" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"></rect><text x="148" y="388" text-anchor="middle" font-weight="600" fill="#1f2328">Мойра</text><text x="148" y="406" text-anchor="middle" font-size="11.5" fill="#1f2328">доля каждого:</text><text x="148" y="422" text-anchor="middle" font-size="11.5" fill="#1f2328">жильё, еда, лечение</text></g><g><rect x="334" y="364" width="172" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="420" y="388" text-anchor="middle" font-weight="600" fill="#1f2328">Общее</text><text x="420" y="406" text-anchor="middle" font-size="11.5" fill="#1f2328">земля, недра,</text><text x="420" y="422" text-anchor="middle" font-size="11.5" fill="#1f2328">энергия, модели</text></g></svg>
