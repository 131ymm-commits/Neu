<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="464" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 760 464" role="img" aria-label="Каждый состоит в пяти пересекающихся кругах, а через них — в полисе и союзе" font-size="13"><rect width="760" height="464" fill="#ffffff"/><defs><marker id="part-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Каждый состоит в пяти пересекающихся кругах, а через них — в полисе и союзе</text><g fill="none" stroke="#8a8f98" stroke-width="1.25"><path d="M196 252H228" marker-end="url(#part-arrow)"></path><path d="M530 200H560" marker-end="url(#part-arrow)"></path><path d="M649 236V302" marker-end="url(#part-arrow)"></path></g><text x="657" y="274" font-size="11.5" fill="#57606a">по жребию</text><g><rect x="24" y="224" width="172" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="110" y="248" text-anchor="middle" font-weight="600" fill="#1f2328">Житель</text><text x="110" y="264" text-anchor="middle" font-size="11.5" fill="#1f2328">человек или даймон</text></g><g><rect x="230" y="64" width="300" height="376" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"></rect><text x="246" y="86" font-weight="600" fill="#1f2328">Круги участия пересекаются</text></g><g><rect x="246" y="96" width="268" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="380" y="120" text-anchor="middle" font-weight="600" fill="#1f2328">Ойкос — дом</text><text x="380" y="136" text-anchor="middle" font-size="11.5" fill="#1f2328">семья любой формы, по выбору</text></g><g><rect x="246" y="164" width="268" height="56" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"></rect><text x="380" y="188" text-anchor="middle" font-weight="600" fill="#1f2328">Хор — дело</text><text x="380" y="204" text-anchor="middle" font-size="11.5" fill="#1f2328">7–150 людей и даймонов, по выбору</text></g><g><rect x="246" y="232" width="268" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="380" y="256" text-anchor="middle" font-weight="600" fill="#1f2328">Фратрия — забота</text><text x="380" y="272" text-anchor="middle" font-size="11.5" fill="#1f2328">с рождения или Пробуждения, у всех</text></g><g><rect x="246" y="300" width="268" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="380" y="324" text-anchor="middle" font-weight="600" fill="#1f2328">Дем — место</text><text x="380" y="340" text-anchor="middle" font-size="11.5" fill="#1f2328">по месту жительства, своё собрание</text></g><g><rect x="246" y="368" width="268" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="380" y="392" text-anchor="middle" font-weight="600" fill="#1f2328">Фила — жребий</text><text x="380" y="408" text-anchor="middle" font-size="11.5" fill="#1f2328">смешивает места и роды</text></g><g><rect x="562" y="164" width="174" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="649" y="188" text-anchor="middle" font-weight="600" fill="#1f2328">Полис</text><text x="649" y="204" text-anchor="middle" font-size="11.5" fill="#1f2328">собрание, Совет, суды,</text><text x="649" y="220" text-anchor="middle" font-size="11.5" fill="#1f2328">стратеги, логисты</text></g><g><rect x="562" y="304" width="174" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="649" y="328" text-anchor="middle" font-weight="600" fill="#1f2328">Союз полисов</text><text x="649" y="344" text-anchor="middle" font-size="11.5" fill="#1f2328">Амфиктиония, казна</text><text x="649" y="360" text-anchor="middle" font-size="11.5" fill="#1f2328">на Делосе, перемирие</text></g></svg>
