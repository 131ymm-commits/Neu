<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reifenwerk</title>
<style>
  :root { /* светлая тёплая тема; --accent — заливка (кнопки, метки), --warn — оранжевый текст, читаемый на белом */
    --bg: #eef0f3; --panel: #ffffff; --panel2: #f7f8fa; --line: #d9dde3; --line2: #e7e9ee;
    --text: #1f2430; --muted: #5b6270; --accent: #f0a030; --warn: #a75a00; --good: #1e7f39; --bad: #c62828; --info: #1d68b0;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; display: flex; overflow: hidden; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #topbar .title { font-weight: 700; letter-spacing: .5px; color: var(--accent); }
  #topbar .stat b { font-variant-numeric: tabular-nums; }
  .speed button { min-width: 38px; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); color: #1f2430; border-color: #d88a1e; }
  #wrap { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #tip { position: absolute; pointer-events: none; background: rgba(255,255,255,.97); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-width: 320px; display: none; font-size: 12px; box-shadow: 0 4px 16px rgba(30,36,48,.15); z-index: 4; }
  #side { width: 420px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #sel { padding: 10px 12px; border-bottom: 1px solid var(--line); min-height: 64px; }
  #tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  #tabs button { flex: 1 1 auto; border: 0; border-radius: 0; background: transparent; padding: 7px 2px; color: var(--muted); font-size: 12px; }
  #tabs button .dot { display: inline-block; min-width: 14px; padding: 0 3px; margin-left: 2px; border-radius: 7px; background: var(--accent); color: #1f2430; font-size: 10px; font-weight: 700; }
  #evbar { max-height: 38vh; overflow-y: auto; }
  #evbar:empty { display: none; }
  .ev { margin: 0 0 8px; padding: 7px 9px; border-radius: 6px; border: 1px solid #f0d3a6; border-left: 4px solid var(--accent); background: #fff6e8; color: var(--text); }
  .ev.good { border-color: #c4e3cb; border-left-color: var(--good); background: #edf7ef; color: var(--text); }
  .ev.bad { border-color: #f1c6c6; border-left-color: var(--bad); background: #fdeeee; color: var(--text); }
  .ev.info { border-color: #c5daf0; border-left-color: var(--info); background: #ebf3fb; color: var(--text); }
  .ev .evt { font-weight: 700; } .ev .evx { font-size: 12px; margin: 3px 0; color: #2c3240; }
  .ev .evc button { background: #ffffff; }
  .ev .evc { display: flex; flex-direction: column; gap: 4px; margin-top: 5px; }
  .ev .evc button { text-align: left; } .ev .evc button small { display: block; color: var(--muted); font-size: 11px; }
  .ev.chip { padding: 4px 9px; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .lock { color: var(--muted); font-size: 11px; }
  #evbar .ev { margin: 6px 8px; }
  .skills button { padding: 0 5px; font-size: 11px; margin-left: 2px; }
  .skills td, .skills th { padding: 2px 3px; }
  .sk { font-size: 9px; color: var(--muted); line-height: 1.1; text-align: center; }
  .sk b { display: block; height: 2px; background: #dfe2e8; margin: 1px 2px 0; } .sk b i { display: block; height: 100%; background: var(--info); }
  #tabs button.on { color: var(--warn); font-weight: 600; box-shadow: inset 0 -3px var(--accent); background: transparent; }
  #panel { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .muted { color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .info { color: var(--info); }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 3px 4px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .prio { width: 24px; padding: 2px 0; text-align: center; font-weight: 700; }
  .p1 { background: #b9e2c0; border-color: #8cc79a; } .p2 { background: #dbebb5; border-color: #b9d38a; } .p3 { background: #f4e2a8; border-color: #dcc37a; } .p4 { background: #f6cfb6; border-color: #e0a988; } .p0 { background: #f1f2f5; color: #a0a6b0; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .card.warn { background: #fff6e8; border-color: #f0d3a6; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bar { height: 6px; background: #dfe2e8; border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #2f9e4f; }
  .log div { padding: 2px 0; border-bottom: 1px dashed var(--line2); }
  h3 { margin: 4px 0 8px; font-size: 13px; color: var(--warn); }
  .shift { font-size: 10px; padding: 0 4px; border-radius: 3px; background: #e6e9ef; color: #3b4250; }
  tr.selrow { background: #fff1db; }
  canvas#cv { touch-action: none; -webkit-user-select: none; user-select: none; }
  .hscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #tut { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); max-height: calc(100% - 20px); overflow-y: auto; background: rgba(255,255,255,.98); color: var(--text); border: 2px solid var(--accent); border-radius: 10px; padding: 12px 14px; display: none; box-shadow: 0 8px 30px rgba(30,36,48,.22); font-size: 14px; line-height: 1.45; z-index: 5; }
  #tut button { min-height: 34px; padding: 4px 12px; }
  #tut .tutbar { height: 3px; background: #e3e6eb; border-radius: 2px; margin: 4px 0 6px; overflow: hidden; } #tut .tutbar i { display: block; height: 100%; background: var(--accent); }
  /* Люди v2: черты, модификаторы настроения, характеристики, правила */
  .chips { display: flex; flex-wrap: wrap; gap: 3px; margin: 3px 0; }
  .chip { font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
  .chip.good { border-color: #a9d8b4; background: #edf7ef; } .chip.bad { border-color: #f1c6c6; background: #fdeeee; } .chip.info { border-color: #c5daf0; background: #ebf3fb; }
  .mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 10px; font-size: 11px; margin: 3px 0; }
  .mods b { display: inline-block; min-width: 26px; text-align: right; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .attrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 2px 10px; font-size: 11px; margin: 4px 0; }
  .attrs .bar { height: 4px; margin-top: 1px; }
  .acts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .pol .plus { color: var(--good); font-size: 12px; } .pol .minus { color: var(--bad); font-size: 12px; }
  .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  /* Gründung и стройка: каталог, планировщик мощности, полоса покупки над картой */
  button.go { background: var(--good); border-color: var(--good); color: #fff; font-weight: 600; }
  button.bigb { padding: 7px 12px; font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; vertical-align: middle; }
  .seg button { border: 0; border-radius: 0; padding: 3px 9px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .slots { width: 100%; font-size: 12px; } .slots td { padding: 3px 4px; } .slots tr.sel { background: #fff1db; }
  .slots .st0 { color: var(--muted); } .slots .st1 { color: var(--good); } .slots .st2 { color: var(--info); }
  .cap { display: grid; grid-template-columns: 74px 1fr 46px; gap: 3px 6px; align-items: center; font-size: 12px; margin: 4px 0; }
  .cap .bar { height: 9px; } .cap .neck { color: var(--bad); font-weight: 700; }
  .chk div { padding: 1px 0; font-size: 12px; }
  .mrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .mrow > div { flex: 1 1 120px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; background: var(--panel); font-size: 11px; }
  .mrow > div.on { border-color: var(--accent); background: #fff6e8; }
  .mrow b { font-size: 12px; }
  #buildBar { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: none; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; background: rgba(255,255,255,.97); border: 1px solid var(--accent); border-radius: 8px; padding: 5px 8px; z-index: 4; box-shadow: 0 4px 14px rgba(30,36,48,.18); max-width: calc(100% - 16px); }
  #buildBar button { min-height: 34px; }
  #buildBar .msg { font-size: 12px; max-width: 260px; line-height: 1.25; }
  #tabs button[hidden] { display: none; }
  /* Смартфон и узкие окна: карта сверху, панель снизу, вкладки листаются, кнопки крупнее */
  @media (max-width: 900px) {
    body { flex-direction: column; }
    #main { flex: 1 1 auto; min-height: 0; }
    #side { width: 100%; height: 46vh; border-left: 0; border-top: 1px solid var(--line); }
    #topbar { gap: 4px 7px; padding: 4px 8px; font-size: 12px; }
    #topbar .title, #zoomBox, #gfxBtn .gl, #tutBtn .gl { display: none; } /* на телефоне: масштаб — двумя пальцами, у кнопок графики и обучения только значок */
    #topbar button, #panel button, #sel button, #evbar button { min-height: 34px; min-width: 36px; }
    .speed button { min-width: 36px; padding: 3px 4px; }
    input[type=checkbox] { width: 18px; height: 18px; vertical-align: middle; }
    #tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    #tabs::-webkit-scrollbar { display: none; }
    #tabs button { flex: 0 0 auto; padding: 10px 12px; font-size: 13px; }
    #sel { min-height: 0; max-height: 15vh; overflow-y: auto; padding: 6px 10px; }
    #evbar { max-height: 27vh; }
    #evbar .ev { margin: 6px; }
    .ev .evc button { min-height: 42px; padding: 6px 10px; }
    .ev .evx { font-size: 12.5px; }
    #panel { padding: 8px; }
    .prio { width: 32px; height: 32px; }
    .skills button { min-height: 30px; padding: 0 9px; }
    #tip { display: none !important; }
    #tut { bottom: 6px; font-size: 12.5px; padding: 8px 10px; line-height: 1.35; max-height: calc(100% - 12px); }
    #tut b.tuth { font-size: 14px !important; }
    #tut.map { position: fixed; bottom: 6px; max-height: 44vh; } /* шаг про участок карты: карточка над нижней панелью, карта видна целиком */
    #buildBar { top: 4px; padding: 4px 6px; gap: 4px; } #buildBar .msg { max-width: 100%; font-size: 11px; } #buildBar button { min-height: 36px; padding: 3px 7px; }
    .cap { grid-template-columns: 64px 1fr 40px; }
  }
</style>
</head>
<body>
<div id="main">
  <div id="topbar">
    <span class="title">REIFENWERK</span>
    <span class="stat"><span id="lDay">День</span> <b id="tDay">1</b>, <b id="tClock">06:00</b> <span id="tShift" class="muted"></span></span>
    <span class="stat" id="sSeason"><b id="tSeason"></b></span>
    <span class="stat"><span id="lMoney">Касса:</span> <b id="tMoney">0 €</b></span>
    <span class="stat" id="sLvl" title="Уровень компании: растёт за отгруженные шины, цели и события (очки развития) при достаточной репутации"><span id="lLvl">Уровень:</span> <b id="tLvl">1</b></span>
    <span class="stat"><span id="lRep">Репутация:</span> <b id="tRep">50</b></span>
    <span class="stat" id="sMor" title="Настроение команды: влияет на скорость работы и больничные"><span id="lMor">Настроение:</span> <b id="tMor">70</b></span>
    <span class="stat"><span id="lToday">Сегодня:</span> <b id="tToday">0</b> <span id="lTires">шин</span></span>
    <button id="gfxBtn" title="Переключить графику">🎨 Графика: пиксели</button>
    <span id="zoomBox"><button id="zoomOut" title="Отдалить (−, колесо мыши)">🔍−</button> <button id="zoomIn" title="Приблизить (+, колесо мыши). Двигать: WASD или правая кнопка мыши">🔍+</button></span>
    <span class="speed">
      <button data-speed="0" title="Пауза (Пробел)">⏸</button>
      <button data-speed="1" title="1">1×</button>
      <button data-speed="3" title="2">3×</button>
      <button data-speed="10" title="3">10×</button>
    </span>
    <span><button id="skipNight" title="Ночью смены нет: досчитать ночь до 05:55 одним щелчком (прессы, грузовики, события считаются честно)" style="display:none;background:#dcebfa;border-color:#1d68b0;color:#123f6b">⏩ Пропустить ночь</button> <label class="muted" id="autoNightL" title="Каждую ночь пропускать автоматически"><input type="checkbox" data-autonight> <span id="lAutoNight">ночь авто</span></label></span>
    <span><button id="langBtn" title="Deutsch / Русский">DE</button> <button id="tutBtn">❓ Обучение</button></span>
  </div>
  <div id="wrap"><canvas id="cv"></canvas><div id="tip"></div><div id="buildBar"></div><div id="tut"></div></div>
</div>
<div id="side">
  <div id="evbar"></div>
  <div id="sel"></div>
  <div id="tabs">
    <button data-tab="start">🚀 Старт</button>
    <button data-tab="build">🏗 Стройка</button>
    <button data-tab="overview" class="on">Цех</button>
    <button data-tab="workers">Люди</button>
    <button data-tab="rules">Правила</button>
    <button data-tab="orders">Заказы</button>
    <button data-tab="stock">Склад</button>
    <button data-tab="upgrades">Апгрейды</button>
    <button data-tab="research">Наука</button>
    <button data-tab="dev">Развитие</button>
    <button data-tab="finance">Финансы</button>
    <button data-tab="events"><span class="tl">События</span><span id="evDot"></span></button>
    <button data-tab="log">Журнал</button>
  </div>
  <div id="panel"></div>
</div>
<script>
'use strict';
// Пиксельная графика Reifenwerk в духе 16-бит (SNES / Mega Drive).
// Мир рисуется в холст 24 px на клетку: станки — объёмные модели (синий + жёлтый), палитры по 5–6 тонов,
// мягкие тени, дизеринг, блики; рабочие в синих комбинезонах и наушниках-антифонах; 8 кадров ходьбы, дыхание,
// своя работа руками для каждого инструмента, вращающиеся шины на 48 шагов, качающиеся крюки, искры, пар, пыль.
// Производительность: всё статичное (пол, стены, рельсы, корпуса станков, кадры спрайтов, надписи) кэшируется
// один раз; каждый кадр — только видимая часть и только то, что движется. Симуляция та же, API window.PixelGfx прежний.
(() => {
const PT = 12;            // единица камеры (как раньше: 12 px на клетку) — для toTile/zoomAt/pan/cam
const Q = 24;             // разрешение мира: 24 px на клетку
const LQ = 6;             // разрешение карты освещения: 6 px на клетку
const OUT = '#16131d';    // контур
const TAU = Math.PI * 2;
const NF = 48;            // кадров на оборот у вращающихся шин
let V = null, wc = null, g = null, bg = null, lightC = null, lampMask = null, warmMask = null;
let time = 0, lastNow = 0, dt = 0, VX = 0, VY = 0, VW = 1, VH = 1;
const LAMPS = [];

// ---------- камера ----------
const cam = { z: 1.1, cx: 25.4 * PT, cy: 14.6 * PT };
function clampCam() {
  if (!V) return; const W = V.MW * PT, H = V.MH * PT;
  cam.z = Math.max(1, Math.min(4, cam.z));
  const vw = W / cam.z, vh = H / cam.z;
  cam.cx = Math.max(vw / 2, Math.min(W - vw / 2, cam.cx)); cam.cy = Math.max(vh / 2, Math.min(H - vh / 2, cam.cy));
}
function viewRect() { const W = V.MW * PT, H = V.MH * PT, vw = W / cam.z, vh = H / cam.z; return [cam.cx - vw / 2, cam.cy - vh / 2, vw, vh]; }
// доля экрана (0..1) → координаты в клетках
function toTile(fx, fy) { if (!V) return [fx * 48, fy * 30]; const [sx, sy, sw, sh] = viewRect(); return [(sx + fx * sw) / PT, (sy + fy * sh) / PT]; }
function zoomAt(f, fx, fy) {
  if (!V) return; const [sx, sy, sw, sh] = viewRect(), wx = sx + fx * sw, wy = sy + fy * sh;
  cam.z *= f; clampCam(); const [, , sw2, sh2] = viewRect();
  cam.cx = wx - (fx - 0.5) * sw2; cam.cy = wy - (fy - 0.5) * sh2; clampCam();
}
function pan(dfx, dfy) { if (!V) return; const [, , sw, sh] = viewRect(); cam.cx += dfx * sw; cam.cy += dfy * sh; clampCam(); }

// ---------- цвет и мелочи ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
const memo = new Map();
const rgbOf = h => { const n = parseInt(h.slice(1, 7), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const hexOf = (r, gg, b) => '#' + (16777216 + (clamp(Math.round(r), 0, 255) << 16) + (clamp(Math.round(gg), 0, 255) << 8) + clamp(Math.round(b), 0, 255)).toString(16).slice(1);
function shade(h, f) {
  const k = h + '/' + f; let v = memo.get(k); if (v !== undefined) return v;
  const [r, gg, b] = rgbOf(h);
  v = f >= 0 ? hexOf(r + (255 - r) * f, gg + (255 - gg) * f, b + (255 - b) * f) : hexOf(r * (1 + f), gg * (1 + f), b * (1 + f));
  memo.set(k, v); return v;
}
function mix(a, b, t) {
  const k = a + '*' + b + '*' + t; let v = memo.get(k); if (v !== undefined) return v;
  const A = rgbOf(a), B = rgbOf(b); v = hexOf(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); memo.set(k, v); return v;
}
// Таблица прозрачностей цвета (17 шагов) — без сборки строк в горячих циклах
const AT = new Map();
function alphas(h) { let a = AT.get(h); if (!a) { const [r, gg, b] = rgbOf(h); a = []; for (let k = 0; k <= 16; k++) a.push(`rgba(${r},${gg},${b},${k / 16})`); AT.set(h, a); } return a; }
const rgba = (h, a) => alphas(h)[clamp(Math.round(a * 16), 0, 16)];
// Тоновая лестница: 0 — глубокая тень (сдвиг в сине-фиолетовый) … 3 — основной … 5 — блик (сдвиг в тёплый)
function ramp(h) {
  const k = 'R' + h; let v = memo.get(k); if (v) return v;
  v = [mix(shade(h, -0.62), '#1a1440', 0.25), mix(shade(h, -0.38), '#2a2050', 0.12), shade(h, -0.17), h, mix(shade(h, 0.28), '#fff4d0', 0.15), shade(h, 0.58)];
  memo.set(k, v); return v;
}
function mk(w, h, rf) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); if (rf) c.getContext('2d', { willReadFrequently: true }); return c; }
function paint(c, fn) { const keep = g; g = c.getContext('2d'); g.imageSmoothingEnabled = false; fn(); g = keep; return c; }
const CC = new Map();
const cache = (k, fn) => { let v = CC.get(k); if (v === undefined) { v = fn(); CC.set(k, v); } return v; };
const vis = (x, y, w, h) => x + w > VX - 8 && y + h > VY - 8 && x < VX + VW + 8 && y < VY + VH + 8;

// ---------- палитры (0 — самый тёмный … 5 — блик) ----------

// ================= Заказы и грузовики =================

function updateTrucks(dt) {

// ================= Станции: приём, выдача, WIP =================
// Eilauftrag: шины срочного заказа идут вне очереди — сначала они, потом остальные (порядок внутри сохраняется)

// WIP — шины в линии от навески на крюки до финального контроля. Склады приёмки, каркасов С3 и готовых шин не считаются.

// ================= Задачи =================
function genJobs() {
  const jobs = [];
  // Грузовики разгружают и загружают погрузчиком (Stapler) — до FORK шин за рейс
  for (const tr of S.trucks) {
    if (tr.state !== 'docked') continue;
    const acc = DOCKS[tr.dock].access;
    if (tr.kind === 'deliver') {
      const e = ST.eingang, room = e.cap - e.items.length - e.resIn;
      const ids = tr.cargo.filter(id => !S.tires.get(id).res).slice(0, Math.min(S.fork, room));

    } else {
      const ids = ST.fertig.items.filter(id => !S.tires.get(id).res && S.tires.get(id).order === tr.order).slice(0, S.fork);
      if (ids.length) jobs.push({ type: 'haul', work: 'transport', tire: ids[0], tires: ids, fork: true, src: 'fertig', from: accessOf('fertig'), dstTruck: tr, to: acc });

    if (s.kind === 'store' && s.next && !viaHook(s, s.next) && s.g !== 'puffer') { // из тележек в прессы — отдельно, краном
      const free = rushFirst(s.items.filter(id => !S.tires.get(id).res));
      if (s.fork) { // склад каркасов С3 → навеска: погрузчиком, не больше WIP-лимита
        const d = GROUP[s.next][0], room = Math.min(d.cap - d.items.length - d.resIn, S.wip - wipCount(), S.fork);
        if (free.length && room >= Math.min(3, free.length)) jobs.push({ type: 'haul', work: 'transport', tire: free[0], tires: free.slice(0, room), fork: true, src: s.id, from, dst: d.id, to: accessOf(d.id) });
      } else { const dst = free.length && chooseDst(s.next); if (dst) jobs.push({ type: 'haul', work: 'transport', tire: free[0], src: s.id, from, dst, to: accessOf(dst) }); }
    }

      const ready = rushFirst(s.out.filter(tid => { const t = S.tires.get(tid); return !t.res && t.readyAt <= S.t && !(held && viaHook(s, nextGroup(t, s))) && !(s.cartOut && S.hook && false); }));

      else if (s.cartOut && ready.length) { // намотанные шины — тележкой по 4 к прессам
        const dst = chooseDst(s.next); if (dst) { const room = ST[dst].cap - ST[dst].items.length - ST[dst].resIn; jobs.push({ type: 'haul', work: 'transport', tire: ready[0], tires: ready.slice(0, Math.min(CART, room)), cart: true, src: s.id, from, dst, to: accessOf(dst) }); }
      } else for (const tid of ready) {

        jobs.push({ type: 'haul', work: 'transport', tire: tid, src: s.id, from, dst, to: accessOf(dst) });
      }
      if (!s.robot && !s.broken && !s.worker && !s.cur && !noPower() && s.input.some(id => S.tires.get(id).readyAt <= S.t) && s.out.length < s.outCap && matsOk(s)) jobs.push({ type: 'work', work: s.work, st: s, to: from, queue: s.loop ? HOOKS.filter(h => !h.hold && h.dest === s.g && h.seg === s.stopSeg).length : 0 });
    }
    if (s.kind === 'auto' && !S.upgrades.ladeportal) { // пресс: зарядить краном, закрыть, после вулканизации достать краном и откатить на обрезку (с Ladeportal всё делает робот)
      if (s.state === 'done') { const tid = s.items.find(id => !S.tires.get(id).res), dst = tid && chooseDst(s.next); if (dst) jobs.push({ type: 'haul', work: 'vulkan', tire: tid, src: s.id, from, dst, to: accessOf(dst), crane: 'pick' }); }

    }

        const own = S.insured ? Math.min(cost, DEDUCT) : cost; S.money -= own; S.stats.repairs += own; S.stats.downtime += down; m.down = (m.down || 0) + down;
        log(LL(`🔧 ${w.name}: ${m.de} снова работает (${b.de}). Простой ${down} мин, запчасти ${eur(cost)}${own < cost ? ` (страховка оплатила ${eur(cost - own)})` : ''}.`,
          `🔧 ${w.name}: ${m.de} läuft wieder (${b.de}). Stillstand ${down} min, Ersatzteile ${eur(cost)}${own < cost ? ` (die Versicherung zahlte ${eur(cost - own)})` : ''}.`), 'good');
        m.broken = null; m.wear = 0; m.dirt *= im ? 0 : 0.5; practice(w, 'technik', 0.05 * learnF(w), b.need, m);
      }
    }
    w.energy = Math.max(0, w.energy - 0.05 * dt * fatigue(w));
    if (!m.broken) { w.act = null; j.i++; }
  } else if (st.pick) {
    w.state = 'lift'; w.act = j.crane === 'pick' ? 'crane' : null; st.t = (st.t || 0) + dt; if (st.t < liftTime(j, 'pick', w)) return; // шину ~30 с, стопку ~50 с, краном ~1,5 мин
    const ids = j.tires || [j.tire], got = [];
    if (j.srcTruck) { for (const id of ids) { const k = j.srcTruck.cargo.indexOf(id); if (k >= 0) { j.srcTruck.cargo.splice(k, 1); got.push(id); } } }
    else { const s = ST[j.src]; const arr = s.kind === 'proc' ? s.out : s.items; for (const id of ids) { const k = arr.indexOf(id); if (k >= 0) { arr.splice(k, 1); got.push(id); } } if (s.kind === 'auto' && !s.items.length) s.state = 'idle'; }
    if (!got.length) { releaseJob(w); return; }
    for (const id of ids) if (!got.includes(id)) { const t = S.tires.get(id); if (t) t.res = false; if (j.dst && j.dst !== 'schrott') ST[j.dst].resIn = Math.max(0, ST[j.dst].resIn - 1); }
    if (j.tires) j.tires = got;
    w.load = got; w.carry = got[0]; w.act = null; for (const id of got) { const t = S.tires.get(id); if (t && j.src && ST[j.src]) t.lastFrom = j.src; } j.i++;
  } else if (st.drop) {
    w.state = 'lift'; w.act = j.crane === 'drop' ? 'crane' : null; st.t = (st.t || 0) + dt; if (st.t < liftTime(j, 'drop', w)) return;
    for (const id of w.load || [w.carry]) { if (j.dstTruck) { j.dstTruck.cargo.push(id); S.tires.get(id).res = false; } else deposit(j.dst, id); }
    w.carry = null; w.load = null; w.act = null; j.i++;
    const pst = j.crane ? ST[j.crane === 'pick' ? j.src : j.dst] : null; // у прессов шину ставят и достают краном — опасный участок
    practice(w, j.work, (j.crane ? 0.006 : 0.004) * learnF(w), j.crane ? 4 : 3, pst); accidentCheck(w, pst);
  } else if (st.scan) { // сканер читает штрихкод: путь шины записан
    w.state = 'lift'; st.t = (st.t || 0) + dt; if (st.t < 0.2) return;
    const sc = DECOR.find(d => d.id === 'scanner');
    for (const id of w.load || [w.carry]) { const t = S.tires.get(id), n = t && t.trace ? t.trace.length + 1 : 1; scanTire(sc, id, t && t.dest === 'schrott' ? LL('в лом', '→ Schrott') : t && t.dest === 'nacharb' ? LL('на переделку', '→ Nacharbeit') : LL(`путь: ${n} участков`, `Weg: ${n} Stationen`)); }
    j.i++;
  } else if (st.take || st.give) { // канистра Gummilösung: взять на М2, отдать на участок
    w.state = 'lift'; st.t = (st.t || 0) + dt; if (st.t < 0.5) return;
    if (st.take) { w.can = Math.min(20, S.mats.loesung); S.mats.loesung -= w.can; w.tool = 'canister'; }
    else { j.st.canister += w.can; w.can = 0; w.tool = null; j.st.fetching = null; log(LL(`${w.name}: принёс канистру Gummilösung с М2 (${j.st.canister} шин).`, `${w.name}: Kanister Gummilösung von М2 geholt (reicht für ${j.st.canister} Reifen).`), 'muted'); }
    j.i++;
  } else if (st.wait) {
    w.state = 'act'; w.act = st.act; st.t = (st.t || 0) + dt;
    if (st.act === 'coffee') { w.energy = Math.min(100, w.energy + 4 * dt); w.restT = S.t; }
    if (st.act === 'sweep' && j.st) j.st.dirt = Math.max(0, j.st.dirt - 0.25 * dt * (cleanupOn() ? 2 : 1));
    if (st.t >= st.wait || (st.until && S.t >= st.until)) { w.act = null; j.i++; } // until — до конца события (забастовка)
  } else if (st.train) { // Schulung в Pausenraum: через час навык выше
    w.state = 'act'; w.act = 'train'; st.t = (st.t || 0) + dt;
    if (st.t >= st.train) { gainSkill(w, j.work, j.gain); growAttr(w, WORK_ATTR[j.work][0], j.work === 'technik' ? 0.8 : 0.4); w.act = null; w.seat = null; log(LL(`📚 ${w.name}: Schulung «${WORK_RU[j.work]}» пройдена, навык ${w.skills[j.work].toFixed(1)}.`, `📚 ${w.name}: Schulung „${WORK_DE[j.work]}“ abgeschlossen, Fähigkeit ${w.skills[j.work].toFixed(1).replace('.', ',')}.`), 'good'); j.i++; }
  } else if (st.work) {
    w.state = 'work'; const s = j.st;
    if (j.type === 'start' ? pressDown() : noPower()) { releaseJob(w); return; } // Stromausfall: работа встаёт
    if (!st.grab) { st.grab = 0; }
    if (st.grab < S.grabT && !s.cur && j.type !== 'start') { st.grab += dt; w.act = 'grab'; return; } // взять инструмент
    w.act = null;
    if (j.type === 'start') {
      const T0 = (s.startT || 10) * (tier(w, 'vulkan') >= 2 ? 0.5 : 1); st.t = (st.t || 0) + dt; s.prog = st.t / T0;
      if (st.t >= T0) { s.state = 'running'; s.timer = cureTime(s); s.worker = null; s.prog = 0; s.ops = (s.ops || 0) + 1; scanTire(s, s.items[0], null); practice(w, 'vulkan', 0.006 * learnF(w), T0, s); accidentCheck(w, s); j.i++; }
    } else {
      if (!s.cur) {
        const k = firstIdx(s.input, id => S.tires.get(id).readyAt <= S.t); // шина после клея должна высохнуть; Eilauftrag — первой
        if (k < 0 || !matsOk(s)) { releaseJob(w); return; }
        s.cur = s.input.splice(k, 1)[0]; matTake(s, 1); if (hasT(w, 'sparsam') && s.mat && rnd() < 0.1) matTake(s, -1); // бережливый: материала на 10 % меньше
        const ct = S.tires.get(s.cur);
        st.dur = workDuration(w, s) + (s.g === 'fuellen' && ct.edge ? 2 : 0) + (s.g === 'ausschl' && ct.holes && !ct.patched && !pflasterOn() ? 6 * S.tMul.pflaster : 0); st.t = 0; // без ветки 9 прокол заклеивают тут же — дольше
      }
      st.t += dt; s.prog = st.t / st.dur; s.busy += dt; s.wear = Math.min(2, s.wear + dt / 900 * S.wearMul);
      if (KW[s.g]) S.kwh += KW[s.g] * dt / 60; // счётчик энергии: Rauen и намотка — мощные машины
      if (rnd() < dt * breakRate(s)) { breakDown(s); return; }
      if (st.t >= st.dur) { finishProc(s, w); j.i++; }
    }
    w.energy = Math.max(0, w.energy - 0.06 * dt * fatigue(w) * S.workFatigue * (HEAVY.includes(s.work) ? 1.15 - 0.015 * AT(w, 'kraft') : 1));
  } else if (st.rest) {
    w.state = 'break'; w.energy = Math.min(100, w.energy + 1.2 * dt * S.restMul); w.restT = S.t;
    if (w.energy >= 96) { w.seat = null; j.i++; }
  } else if (st.leave) { w.away = true; w.state = 'home'; w.job = null; w.x = EXIT.x; w.y = EXIT.y; return; }
  if (j.i >= j.steps.length) { w.job = null; w.state = 'idle'; }
}

// ---------- Кредит KfW (Gründerkredit): до открытия сумму можно менять, платёж — раз в расчётный месяц (30 дней) ----------

}

  log(LL(`🏦 KfW: досрочно погашено ${eur(v)}, остаток ${eur(S.kfw.bal)}.`, `🏦 KfW: Sondertilgung ${eur(v)}, Rest ${eur(S.kfw.bal)}.`), 'good'); return true;
}

  for (const l of S.leases.filter(x => x.left <= 0)) { const s = ST[l.id]; if (s && s.lease) { s.lease = null; s.buy = { price: 0, at: S.t }; } } S.leases = S.leases.filter(l => l.left > 0);

const RECO = { 1: { presses: 6, aufbau: 1, pruef: 1, entgr: 1, forks: 1, scanner: false, s11: false }, 2: { presses: 7, aufbau: 2, pruef: 2, entgr: 2, forks: 2, scanner: true, s11: true }, 3: { presses: 10, aufbau: 2, pruef: 2, entgr: 2, forks: 2, scanner: true, s11: true } };

// Сезонный грипп: декабрь–февраль, утром — шанс заболеть (плохое настроение и больные в смене — чаще, крепкие — реже)

  'Willkommen im Reifenwerk! Du bist ein Start-up: Du hast ein Runderneuerungswerk samt 15-köpfigem Team gemietet. Die Bank gibt dir einen KfW-Gründerkredit (Reiter „Finanzen“), danach heißt es: wachsen, optimieren, investieren. Das Werk folgt dem Vorbild: Heißverfahren — Hängebahn in Ж1–Ж2, Rohgummi-Wicklung, 10 Heizpressen mit Formen, Entgraten, Scanner, Kontrolle, Versand über die Rampe Р. Zwei Aufträge laufen schon, ein Lkw fährt gerade ans Tor З. Aufträge werden automatisch angenommen (Reiter „Aufträge“).'), 'info');
applyLang();
// Обучение — при первом запуске (флаг в localStorage): в Gründung — шаги бизнес-плана, в работающем цехе — остальные. ?tut=1 — показать всегда, ?tut=0 — не показывать
startTut(params.get('tut') === '1');
requestAnimationFrame(frame);

// ================= API для автоматической игры и тестов =================
window.RW = {
  S, ST, STATIONS, GROUP, HOOKS, VIEW, advance, acceptOffer, declineOffer, buy, hire, wipCount, setHook, setGfx,
  showTut, applyLang, TUT, setLang: lg => { S.lang = lg === 'de' ? 'de' : 'ru'; try { localStorage.setItem('rw-lang', S.lang); } catch (e) { /* без хранилища */ } applyLang(); if (tut !== null) showTut(tut); return S.lang; },
  setSpeed: v => { S.speed = v; renderTop(); },
  setPrio: (name, work, p) => { const w = S.workers.find(w => w.name.startsWith(name)); if (w) w.prio[work] = p; },
  summary: () => ({
    phase: S.phase, day: day(), clock: fmtClock(clock()), money: Math.round(S.money), rep: Math.round(S.rep), level: S.level, xp: Math.round(S.xp), morale: Math.round(S.morale), shipped: S.shipped, scrap: S.scrap,
    doneToday: S.doneToday, doneYesterday: S.doneYesterday, leadMin: avgLead(), walkTodayM: Math.round(S.stats.walkToday * 1.5), wip: `${wipCount()}/${S.wip}`, hooksBusy: HOOKS.filter(h => h.tire).length,
    stations: Object.fromEntries(STATIONS.filter(s => s.built).map(s => [s.id, s.kind === 'proc' ? `${s.input.length}>${s.cur ? 1 : 0}>${s.out.length} ${util(s)}%` : s.kind === 'auto' ? `${s.state}:${s.items.length} ${util(s)}%` : String(s.items.length)])),
    workers: S.workers.map(w => `${w.name.split(' ')[0]}(${w.shift}): ${jobText(w)} (${Math.round(w.energy)}%)`),
    offers: S.offers.map(o => `${o.id} ${o.customer} ${o.qty}×${o.price}`),
    orders: S.orders.filter(o => o.state !== 'done').map(o => `${o.customer} ${o.state} ${o.finished}/${o.qty} лом ${o.scrapped}${o.rush ? ' ⚡' : ''}${o.prod && o.prod !== 'lkw' ? ' ' + o.prod : ''}`),
    mats: { ...S.mats }, trucks: S.trucks.map(t => `${t.kind} ${t.state} ${t.cargo.length}`),
    breakdowns: S.stats.breakdowns, broken: MACHINES.filter(m => m.broken).map(m => `${m.id}: ${m.broken.de} ${m.broken.tech ? Math.round(m.broken.done / m.broken.need * 100) + '%' : 'ждёт'}`),
    downtimeMin: Math.round(S.stats.downtime), repairsEur: S.stats.repairs,
    events: S.events.map(e => `${e.kind}:${e.state}`), goals: S.goals.map(g => g.id), research: S.res.cur, researched: S.res.done.length, upgrades: Object.keys(S.upgrades),
    // Люди v2
    month: MONTHS_DE[month()], season: seasonMul(), policies: Object.keys(S.pol).filter(pol), grades: { ...S.grades }, hr: { ...S.hr, accLog: S.hr.accLog.length },
    moodMin: Math.round(Math.min(...S.workers.map(w => w.mood))), lowMood: S.workers.filter(w => w.mood < brkThr(w)).length, injured: S.workers.filter(w => w.injured && w.sickUntil > S.t).map(w => w.name), inBreak: S.workers.filter(w => w.brk).map(w => `${w.name}:${w.brk.kind}`), inspired: S.workers.filter(w => w.insp).map(w => `${w.name}:${w.insp.kind}`),
  }),
  // ---- Люди v2: тестовые хуки ----
  setPolicy: (id, on, force = false) => { const r = setPolicy(id, on, force); renderPanel(); return r; }, // force — без 7-дневного ожидания
  policies: () => POLICIES.map(p => ({ id: p.id, de: p.de, on: pol(p.id), cooldownMin: Math.round(polLeft(p.id)) })),
  workerInfo: id => {
    const w = typeof id === 'string' ? S.workers.find(x => x.name.startsWith(id)) : workerById(id); if (!w) return null;
    const nm = o => o.name;
    return { id: w.id, name: w.name, age: Math.floor(w.age), shift: w.shift, wage: w.wage, market: marketWage(w), traits: [...w.traits], attr: Object.fromEntries(ATTRS.map(a => [a, +w.attr[a].toFixed(2)])), passions: { ...w.pass },
      skills: Object.fromEntries(WORKS.map(k => [k, +w.skills[k].toFixed(2)])), xpMinToday: { ...w.xpMin }, mood: +w.mood.toFixed(1), moodTarget: Math.round(moodTarget(w)), breakAt: brkThr(w),
      mods: moodParts(w).map(p => ({ label: S.lang === 'de' ? p[1] : p[0], v: p[2], leftMin: p[3] ? Math.round(p[3] - S.t) : null })), brk: w.brk, insp: w.insp, badge: w.badge, ppe: w.ppe, injured: !!(w.injured && w.sickUntil > S.t), away: w.away, job: jobText(w),
      friends: friendsOf(w).map(nm), rivals: rivalsOf(w).map(nm), mentor: w.mentor != null && workerById(w.mentor) ? workerById(w.mentor).name : null, pupils: pupilsOf(w).map(nm), learnF: +learnF(w).toFixed(2) };
  },
  forceInspiration: (id, kind) => { const w = typeof id === 'string' ? S.workers.find(x => x.name.startsWith(id)) : workerById(id); if (!w) return false; w.insp = null; return inspire(w, kind); },
  forceAccident: id => { const w = typeof id === 'string' ? S.workers.find(x => x.name.startsWith(id)) : workerById(id); if (!w) return false; const s = w.lastSt && ST[w.lastSt]; return accident(w, s || null); },
  forceBreak: (id, major = false, kind) => { const w = typeof id === 'string' ? S.workers.find(x => x.name.startsWith(id)) : workerById(id); return !!w && mentalBreak(w, major, kind); },
  setMentor, praise, bonusW, raiseWage, setMonth: m => { S.calOff = 0; S.calOff = ((m - month()) % 12 + 12) % 12 * MONTH_DAYS; return MONTHS_DE[month()]; },
  safety: () => ({ accidents: S.hr.acc, fines: S.hr.fines, daysWithout: Math.floor((S.t - S.lastAccident) / 1440), log: S.hr.accLog.map(a => `${fmtDT(a.t)} ${a.name} ${a.st} ${a.days}d${a.viol ? ' Verstoß' : ''}`), psaStock: S.mats.psa, wearing: S.workers.filter(w => !w.away && w.ppe).length }),
  oee: id => oee(ST[id]),
  MACHINES, breakDown, UPGRADES, buyUpgrade,
  // События: список, запустить вручную (с выбором варианта сразу), выбрать вариант
  events: () => S.events.map(e => ({ id: e.id, kind: e.kind, title: e.title, text: e.text, state: e.state, x: e.x, y: e.y, until: e.until, choices: e.choices && e.choices.map(c => c.t) })),
  EVENT_KINDS: Object.keys(EVENTS), eventLog: () => S.eventLog,
  triggerEvent: (kind, choice, force = true) => { const e = fireEvent(kind, {}, force); if (e && choice !== undefined && e.state === 'choice') chooseEvent(e.id, choice); return e && { id: e.id, kind: e.kind, state: e.state, text: e.text, res: e.res }; },
  chooseEvent, fireEvent,
  // Развитие, люди, исследования, кредит, ночь
  level: () => ({ level: S.level, name: LEVELS[S.level - 1].de, xp: S.xp, rep: S.rep, next: LEVELS[S.level] || null }),
  goals: () => S.goals.map(g => { const G = GOAL_BY[g.id], [v, m] = G.p(g); return `${goalT(G)}: ${Math.round(v)}/${m}`; }), goalsDone: () => S.goalsDone,
  RESEARCH, research, unresearch, setRD: i => { S.res.rd = i; },
  hireCand, train, fire, praemie, takeLoan, repayLoan, skipNight, tier, rankOf, setShiftModel, negotiate, debt,
  finance: () => { const t = statDiff(S.stats, S.snap); return { cash: Math.round(S.money), debt: debt(), receivables: recvSum(), lossCarry: S.lossCarry, days: S.days.map(r => ({ d: r.d, done: r.done, revenue: Math.round(r.revenue), ebt: Math.round(ebt(r)), tax: r.tax, cash: r.cash })), todayEbt: Math.round(ebt(t)) }; },
  profile: (min = 240) => profile(min),
  draw: (t = tab) => { setTab(t); setViewBuild(); if (S.gfx === 'pixel' && window.PixelGfx) { window.PixelGfx.render(VIEW); pixDrawn = true; if (tutCam) { tutFocus(tutCam); tutCam = null; } } else render(); drawMoodOverlay(); drawTutArea(); renderTop(); renderSel(); renderPanel(); return $('panel').innerHTML.length; }, // один кадр и панель — для тестов
};
// Старые хуки рассчитаны на работающий цех. Если их зовут во время бизнес-плана (новая игра по умолчанию) — сначала «Быстрый старт»:
// RW.advance(…) без выбора даёт тот же цех, что и ?quick=1 (тот же ?seed=). Для бизнес-плана — свои хуки ниже.
for (const k of ['advance', 'acceptOffer', 'declineOffer', 'hire', 'setHook', 'setPrio', 'setPolicy', 'workerInfo', 'forceInspiration', 'forceAccident', 'forceBreak', 'setMentor', 'praise', 'bonusW', 'raiseWage', 'setMonth', 'breakDown', 'buyUpgrade',
  'triggerEvent', 'chooseEvent', 'fireEvent', 'research', 'unresearch', 'setRD', 'hireCand', 'train', 'fire', 'praemie', 'takeLoan', 'repayLoan', 'skipNight', 'setShiftModel', 'negotiate', 'profile']) {
  const f = window.RW[k]; window.RW[k] = (...a) => { ensureRun(); return f(...a); };
}
// Ключ места: 'presse4' или (тип, номер) — ('presse', 4); без номера — первое пустое место этого типа
const slotId = (type, slot) => ST[type] && !GROUP[type] ? type : slot === undefined || slot === null ? ((GROUP[type] || []).find(s => !s.built) || {}).id : typeof slot === 'number' ? (GROUP[type] && GROUP[type].length > 1 ? type + slot : type) : slot;
Object.assign(window.RW, {
  // ---- Gründung и стройка ----
  phase: () => S.phase,
  quickStart: () => quickStart(),                       // готовый цех как раньше (только из бизнес-плана)
  autoPlan: (opts = {}) => autoPlan(opts),              // оптимальная схема + команда + кредит под текущую модель смен
  autoStaff: () => autoStaff(),
  open: force => openPlant(force),                     // { ok, errors, warnings }
  validate: () => validate(),
  capacity: () => capacity(),                           // { thr, neck, stages:[{k,name,cap}], costT, breakEven, profit, fixed, … }
  // RW.buy('rohgummi') — как раньше, материал; RW.buy('presse', 4, 'pro'), RW.buy('presse4', 'used'), RW.buy('rauen', 2), RW.buy('fork'), RW.buy('scanner'), RW.buy('b9');
  // opts.lease — пресс в лизинг
  buy: (type, slot, model, opts) => {
    // 'pflaster' — и материал, и пост заклейки: без места и модели в работающем цехе — материал (как раньше), в бизнес-плане — пост
    if (MATS[type] && slot === undefined && model === undefined && !(S.phase === 'plan' && ST[type])) { ensureRun(); return buy(type); }
    if (type === 'fork') return buyFork(); if (type === 'scanner') return buyScanner(); if (SECTIONS[type]) return buySection(type);
    if (ST[type] && !GROUP[type]) return buySlot(type, slot || 'std', model || {});
    const id = slotId(type, slot); if (!id || !ST[id]) return { ok: false, why: 'slot?' };
    return buySlot(id, model || 'std', opts || {});
  },
  sell: slot => slot === 'fork' ? sellFork() : slot === 'scanner' ? sellScanner() : SECTIONS[slot] ? sellSection(slot) : ST[slot] ? sellSlot(slot) : { ok: false, why: 'slot?' },
  buySection: id => buySection(id), sellSection: id => sellSection(id),
  setLoan: v => setLoan(v), kfwRepay: v => kfwRepay(v),
  setPos: (id, k) => setPos(id, k), positions: id => ALTS[ST[id].g].map((a, k) => ({ k, label: L(a.ru, a.de), on: ST[id].pos === k, ...altWalk(id, k) })),
  planHire: (cid, shift) => hireCand(cid, shift), planFire: id => fire(id), planShiftModel: n => setShiftModel(n), jobAd: () => jobAd(),
  cands: () => S.cands.map(c => ({ id: c.id, name: c.name, k: c.k, a: c.a, k2: c.k2, b: c.b, wage: c.wage, fee: c.fee, traits: [...c.w.traits] })),
  slots: () => STATIONS.map(s => ({ id: s.id, g: s.g, built: s.built, model: s.model, lease: !!s.lease, inst: s.inst ? Math.round(s.inst - S.t) : 0, pending: s.pending, pos: s.pos, lock: slotLock(s) || null })),
  sections: () => Object.keys(SECTIONS).map(id => ({ id, built: !!S.sec[id], on: secOn(id), price: SECTIONS[id].price })),
  finance: () => { const t = statDiff(S.stats, S.snap); return { cash: Math.round(S.money), debt: debt(), kfw: Math.round(S.kfw.bal), leases: S.leases.length, receivables: recvSum(), lossCarry: S.lossCarry,
    days: S.days.map(r => ({ d: r.d, done: r.done, revenue: Math.round(r.revenue), ebt: Math.round(ebt(r)), tax: r.tax, cash: r.cash, rent: Math.round(r.rent || 0), energy: Math.round(r.energy || 0), afa: Math.round(r.afa || 0), interest: Math.round(r.interest || 0), wages: Math.round(r.wages || 0), materials: Math.round(r.materials || 0) })), todayEbt: Math.round(ebt(t)) }; },
  CAT, MODELS, SECTIONS, ALTS,
});
// Профилировщик: сколько мс уходит на части симуляции за min игровых минут
function profile(min) {
  const T = {}, wrap = (n, f) => function (...a) { const t0 = performance.now(); try { return f.apply(this, a); } finally { T[n] = (T[n] || 0) + performance.now() - t0; } };
  const o = { genJobs, findPath, updateHooks, assignJobs, updateRobots, checkOrders, updateTrucks, updateEvents, updateGoals, updateResearch, updateWorker };
  genJobs = wrap('genJobs', o.genJobs); findPath = wrap('findPath', o.findPath); updateHooks = wrap('updateHooks', o.updateHooks); assignJobs = wrap('assignJobs', o.assignJobs);
  updateRobots = wrap('updateRobots', o.updateRobots); checkOrders = wrap('checkOrders', o.checkOrders); updateTrucks = wrap('updateTrucks', o.updateTrucks); updateEvents = wrap('updateEvents', o.updateEvents);
  updateGoals = wrap('updateGoals', o.updateGoals); updateResearch = wrap('updateResearch', o.updateResearch); updateWorker = wrap('updateWorker', o.updateWorker);
  const t0 = performance.now(); advance(min); const tot = performance.now() - t0;
  ({ genJobs, findPath, updateHooks, assignJobs, updateRobots, checkOrders, updateTrucks, updateEvents, updateGoals, updateResearch, updateWorker } = o);
  return { totalMs: Math.round(tot), msPerGameHour: +(tot / min * 60).toFixed(2), parts: Object.fromEntries(Object.entries(T).map(([k, v]) => [k, Math.round(v)])) };
}
})();
