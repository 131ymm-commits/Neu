<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bäckerei</title>
<style>
  :root { --bg: #f3efe8; --panel: #faf8f4; --panel2: #ffffff; --line: #e0d7ca; --text: #2a2420; --muted: #7a6e62; --accent: #b8661a; --accentBg: #f7e3c8; --good: #2e7d3c; --bad: #c0392b; --info: #2a6aa8; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; display: flex; overflow: hidden; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #topbar .title { font-weight: 700; letter-spacing: .5px; color: var(--accent); }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); } button:disabled { opacity: .45; cursor: default; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.big { padding: 7px 12px; font-weight: 600; }
  button.go { background: #2e7d3c; border-color: #2e7d3c; color: #fff; }
  button.blue { background: #2f6db5; border-color: #2f6db5; color: #fff; }
  #wrap { flex: 1; position: relative; background: #e9e2d6; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #tip { position: absolute; pointer-events: none; background: rgba(255,253,249,.97); box-shadow: 0 4px 14px rgba(80,60,40,.18); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-width: 320px; display: none; font-size: 12px; z-index: 3; }
  #side { width: 430px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #sel { padding: 10px 12px; border-bottom: 1px solid var(--line); min-height: 64px; }
  #tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  #tabs button { flex: 1 0 auto; border: 0; border-radius: 0; background: transparent; padding: 7px 7px; color: var(--muted); }
  #tabs button.on { color: var(--accent); box-shadow: inset 0 -2px var(--accent); background: var(--panel2); font-weight: 600; }
  #panel { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .muted { color: var(--muted); } .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--accent); } .info { color: var(--info); }
  .small { font-size: 11px; }
  table { border-collapse: collapse; width: 100%; } th, td { padding: 3px 4px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  .prio { width: 24px; padding: 2px 0; text-align: center; font-weight: 700; }
  .p1 { background: #bfe3c4; } .p2 { background: #dcebb8; } .p3 { background: #f2e3b3; } .p0 { background: #f1ede6; color: #b5aca0; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .row.wrap { flex-wrap: wrap; justify-content: flex-start; }
  .log div { padding: 2px 0; border-bottom: 1px dashed #e6dfd4; }
  h3 { margin: 4px 0 8px; font-size: 13px; color: var(--accent); }
  h4 { margin: 10px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 6px; margin-bottom: 8px; }
  .cat button { display: flex; gap: 6px; align-items: center; text-align: left; padding: 4px 6px; min-height: 50px; line-height: 1.2; }
  .cat button.on { background: var(--accentBg); border-color: var(--accent); color: var(--text); }
  .cat img { width: 42px; height: 34px; image-rendering: pixelated; flex: none; object-fit: contain; }
  .cat small { display: block; color: var(--muted); font-size: 11px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; vertical-align: middle; }
  .seg button { border: 0; border-radius: 0; padding: 3px 9px; }
  .pill { display: inline-block; padding: 0 6px; border-radius: 9px; background: #f1ede6; border: 1px solid var(--line); font-size: 11px; white-space: nowrap; }
  .chk div { padding: 2px 0; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 70px; margin: 6px 0 2px; border-bottom: 1px solid var(--line); }
  .bars div { flex: 1; min-height: 1px; background: var(--good); opacity: .85; border-radius: 2px 2px 0 0; }
  .bars div.neg { background: var(--bad); }
  .meter { height: 6px; background: #ece6dc; border-radius: 3px; overflow: hidden; margin-top: 3px; } .meter div { height: 100%; background: var(--good); }
  #buildBar { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: none; gap: 6px; align-items: center; background: rgba(255,253,249,.97); border: 1px solid var(--accent); border-radius: 8px; padding: 5px 8px; z-index: 4; box-shadow: 0 4px 14px rgba(80,60,40,.18); max-width: calc(100% - 16px); }
  #buildBar button { min-height: 36px; min-width: 40px; }
  #buildBar .msg { font-size: 12px; max-width: 240px; }
  #tut { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(540px, calc(100% - 24px)); background: rgba(255,253,249,.98); border: 2px solid var(--accent); border-radius: 10px; padding: 12px 14px; display: none; box-shadow: 0 8px 30px rgba(80,60,40,.25); font-size: 14px; line-height: 1.45; z-index: 5; }
  #tut button { min-height: 34px; padding: 4px 12px; }
  #modal { position: absolute; inset: 0; background: rgba(60,48,36,.42); display: none; align-items: center; justify-content: center; z-index: 8; }
  #modal > div { box-shadow: 0 10px 40px rgba(60,40,20,.3); background: var(--panel); border: 2px solid var(--accent); border-radius: 10px; padding: 16px; width: min(440px, calc(100% - 24px)); }
  @media (max-width: 900px) {
    body { flex-direction: column; }
    #main { flex: 1 1 auto; min-height: 0; }
    #side { width: 100%; height: 44vh; border-left: 0; border-top: 1px solid var(--line); }
    #topbar { gap: 4px 10px; padding: 4px 8px; font-size: 12px; }
    #topbar button, #panel button, #sel button { min-height: 34px; min-width: 36px; }
    #tabs { flex-wrap: nowrap; overflow-x: auto; } #tabs button { flex: 0 0 auto; padding: 10px 11px; }
    #sel { min-height: 0; max-height: 18vh; overflow-y: auto; padding: 6px 10px; }
    .prio { width: 32px; height: 32px; }
    .cat { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    #tut { bottom: 6px; font-size: 12.5px; padding: 8px 10px; line-height: 1.35; }
    #tut b { font-size: 14px !important; }
    #buildBar { top: 4px; padding: 4px 6px; } #buildBar .msg { max-width: 150px; font-size: 11px; }
  }
</style>
</head>
<body>
<div id="main">
  <div id="topbar">
    <span class="title">BÄCKEREI</span>
    <span><span id="lDay">День</span> <b id="tDay">1</b>, <b id="tClock">05:00</b> <span id="tPhase" class="muted"></span></span>

  <div id="wrap"><canvas id="cv"></canvas><div id="tip"></div><div id="buildBar"></div><div id="tut"></div><div id="modal"><div id="modalBox"></div></div></div>
</div>
<div id="side">
  <div id="sel"></div>
  <div id="tabs"></div>

<script>
'use strict';
(() => {
// ================= Константы =================
const TILE = 24, MW = 40, MH = 30, PT = 12;   // 1 клетка ≈ 1 м
const MIN_PER_SEC = 0.75;                      // игровых минут в секунду на 1×
const WALK = 22;                               // клеток в минуту
const OPEN = 6 * 60, ROLL = 19 * 60, PM_AT = 11 * 60; // магазин открывается; новый день плана; вторая волна плана
const RENT = 3000, MONTH = 30, ELEC = 0.30, BASE_KW = 5, NIGHT_BONUS = 0.25; // аренда в месяц, €/кВт·ч, фоновая нагрузка, ночная надбавка
const START_CAPITAL = 40000, AFA_DAYS = 3600;  // собственный капитал; амортизация 10 лет
const LOAN = { rate: 0.049, months: 60, max: 125000, step: 5000 };

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const params = new URLSearchParams(location.search);
const rnd = mulberry32(Number(params.get('seed')) || 20261016);
const R = (a, b) => a + rnd() * (b - a), RI = (a, b) => Math.floor(R(a, b + 1)), pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ================= Карта: пустое здание =================
const T_GRASS = 0, T_ROAD = 1, T_PAVE = 2, T_TILE = 3, T_WOOD = 4, T_WALL = 5, T_DOOR = 6, T_CONC = 7, T_YARD = 8, T_WIN = 9;
const grid = new Uint8Array(MW * MH), blocked = new Uint8Array(MW * MH), RESERVED = new Uint8Array(MW * MH);
const I = (x, y) => y * MW + x;
const area = (x0, y0, x1, y1, t) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) grid[I(x, y)] = t; };
const wallH = (y, x0, x1) => area(x0, y, x1, y, T_WALL), wallV = (x, y0, y1) => area(x, y0, x, y1, T_WALL);
area(0, 0, MW - 1, MH - 1, T_GRASS);
area(0, 0, MW - 1, 1, T_ROAD); area(0, 2, MW - 1, 3, T_YARD);        // задняя улица и двор

area(5, 5, 12, 9, T_CONC); area(14, 5, 18, 9, T_CONC); area(20, 5, 26, 9, T_WOOD); area(28, 5, 34, 9, T_WOOD); area(5, 19, 34, 23, T_WOOD);
wallH(4, 4, 35); wallH(24, 4, 35); wallV(4, 4, 24); wallV(35, 4, 24);
wallH(10, 4, 35); wallV(13, 4, 10); wallV(19, 4, 10); wallV(27, 4, 10); wallH(18, 4, 35);
for (let x = 6; x <= 33; x++) if (x < 18 || x > 21) grid[I(x, 24)] = T_WIN; // витрины
for (const [x, y] of [[8, 4], [16, 4], [10, 10], [16, 10], [23, 10], [31, 10], [9, 18], [33, 18], [19, 24], [20, 24]]) grid[I(x, y)] = T_DOOR;
// клетки у дверей держим свободными — иначе можно замуровать проход
for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (grid[I(x, y)] === T_DOOR) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < MW && ny < MH) RESERVED[I(nx, ny)] = 1; }
const isFloor = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH && [T_TILE, T_WOOD, T_CONC].includes(grid[I(x, y)]);

const ZONES = [
  { name: 'LAGER', x: 5, y: 5, w: 8, h: 5, tint: 'rgba(120,110,90,.10)' },

  { name: 'LADEN', x: 5, y: 19, w: 30, h: 5, tint: null },
];
const BZ = { back: { x0: 5, y0: 11, x1: 34, y1: 17 }, shop: { x0: 5, y0: 19, x1: 34, y1: 23 } }; // где можно строить
const inZone = (z, x, y) => x >= z.x0 && x <= z.x1 && y >= z.y0 && y <= z.y1;
// постоянная обстановка здания (не продаётся): склад, холодильник, офис, комната отдыха, мойка
const DECOR = [

  { id: 'regal', x: 10, y: 5, w: 3, h: 1, desc: 'Стеллаж: щёлок (Lauge), сахар, соль, семечки, био-мука.', desc_de: 'Regal: Lauge, Zucker, Salz, Saaten, Bio-Mehl.' },
  { id: 'kuehlregal', x: 14, y: 5, w: 5, h: 1, desc: 'Холодильная камера: масло, яйца, дрожжи, молоко, начинки.', desc_de: 'Kühlraum: Butter, Eier, Hefe, Milch, Beläge.' },

  { id: 'pausetisch', x: 30, y: 7, w: 3, h: 1, desc: 'Комната отдыха.', desc_de: 'Pausenraum.' },

for (const d of DECOR) for (let y = d.y; y < d.y + d.h; y++) for (let x = d.x; x < d.x + d.w; x++) decorMask[I(x, y)] = 1;
const MEHL_ACC = { x: 8, y: 6 }, LAUGE_ACC = { x: 11, y: 6 }, BIO_ACC = { x: 9, y: 8 }, KUEHL_ACC = { x: 16, y: 6 }, WERKZEUG = { x: 25, y: 6 }, COFFEE_P = { x: 33, y: 6 }, SPUELE = { x: 33, y: 12 };
RESERVED[I(SPUELE.x, SPUELE.y)] = 1;
const SEATS = [[29, 7], [33, 7], [30, 6], [32, 6], [30, 8], [32, 8], [31, 8], [29, 6], [33, 8]];
const ENTRY = { x: 0, y: 2 };
const VAN_OWN = { x: 6.5, y: 2.5, board: { x: 8, y: 3 } }, VAN_SUP = { x: 16.5, y: 2.5, acc: { x: 16, y: 3 } };
const DOOR_IN = { x: 19, y: 23 }, DOOR_OUT = { x: 20, y: 26 };
const KEY_POINTS = [MEHL_ACC, LAUGE_ACC, BIO_ACC, KUEHL_ACC, WERKZEUG, COFFEE_P, SPUELE, DOOR_IN, DOOR_OUT, VAN_OWN.board, VAN_SUP.acc];

const PRODUCTS = {

  brezel: { de: 'Laugenbrezel', ru: 'Брецели', perTray: 20, price: 1.30, mats: { mehl: 1.6, kuehl: 0.2, lauge: 0.6 }, knead: 10, rest: 10, shape: 9, at: 'tisch', proof: 25, bake: 18, cool: 10, batch: 3, col: '#7a3f18', raw: '#efe2c4', lauge: true, base: true, el: 1.2, dem: { p: 0.25, q: [1, 3], tod: 'all' } },
  croissant: { de: 'Croissant', ru: 'Круассаны', perTray: 12, price: 1.90, mats: { mehl: 0.8, kuehl: 1.2 }, knead: 8, rest: 30, shape: 10, at: 'tisch', proof: 60, bake: 17, cool: 15, batch: 2, col: '#e0a14a', raw: '#f3e6c8', base: true, el: 1.4, dem: { p: 0.15, q: [1, 2], tod: 'morning' } },

  vollkorn: { de: 'Vollkornbrot', ru: 'Цельнозерновой хлеб', perTray: 8, price: 5.40, mats: { mehl: 5.5, kuehl: 0.1 }, knead: 14, rest: 30, shape: 8, at: 'tisch', proof: 60, bake: 55, cool: 45, batch: 2, col: '#6e4524', raw: '#d9c49c', el: 0.9, dem: { p: 0.12, q: [1, 1], tod: 'all' }, recipe: 800,

    today: { served: S.d.served, left: S.d.left, shop: Math.round(S.d.shop), b2b: Math.round(S.d.b2b), sold: { ...S.d.sold }, lost: { ...S.d.lost }, burnt: S.d.burnt },
    yesterday: { served: S.y.served, left: S.y.left, shop: Math.round(S.y.shop), b2b: Math.round(S.y.b2b), sold: { ...S.y.sold }, lost: { ...S.y.lost }, waste: { ...S.y.waste }, burnt: S.y.burnt, coffee: S.y.coffee },
    items: S.items.length, display: Object.fromEntries(offered().map(p => [p, DISPLAYS.filter(d => d.prod === p).reduce((a, d) => a + d.stock, 0)])), started: { ...S.started }, mats: Object.fromEntries(Object.entries(S.mats).map(([k, v]) => [k, Math.round(v)])),
    orders: S.orders.map(o => `${o.cid}:${o.state}`), loan: Math.round(S.loan.bal), vatDue: Math.round(S.vatDue),
    workers: S.workers.map(w => `${w.name.split(' ')[0]}(${w.shift}): ${jobText(w)} (${Math.round(w.energy)}%)`), customers: S.customers.length }),
};
})();
</script>
