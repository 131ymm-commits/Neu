[item-description]
magnetics-ferrite=Железная руда, спечённая с камнем в магнитную керамику. Сердечник каждой катушки.
magnetics-coil=Медный кабель на ферритовом сердечнике. Универсальная деталь магнитных машин.
magnetics-magnet-alloy=Сталь, феррит и медь, сплавленные вихревыми токами. Основа магнитных машин синего уровня.
magnetics-superconducting-cable=Магнитный сплав в пластиковой оболочке, замороженный жидким азотом. Проводит ток без потерь.
magnetics-flux-crystal-uncharged=Заряжается в резонаторе потока. Динамо-машина потока возвращает его после разрядки.
magnetics-flux-crystal=Заряженный кристалл на 100 МДж. Топливо динамо-машины потока и сердечник рельсовой болванки потока.
magnetics-ferrite-slug=Боеприпас катушечника. Болванка пробивает мелких врагов, стоящих на одной линии.
magnetics-magnet-slug=Тяжёлый боеприпас катушечника, не теряющий силы против брони.
magnetics-gauss-slug=Боеприпас пушки Гаусса: один тяжёлый удар, почти не замечающий брони.
magnetics-rail-slug=Боеприпас рельсовой пушки. Поражает всех врагов на линии длиной 36 клеток.
magnetics-flux-rail-slug=Рельсовая болванка вокруг заряженного кристалла: три выстрела с физическим и электрическим уроном.

