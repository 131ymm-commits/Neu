[entity-description]
magnetics-sintering-kiln=Сжигает топливо и спекает железную руду с камнем в феррит.
magnetics-induction-furnace=Электропечь для феррита и магнитного сплава.
magnetics-coil-winder=Наматывает медный кабель на ферритовые сердечники.
magnetics-cryo-chamber=Сжижает азот из воздуха, делает сверхпроводящий кабель и выращивает кристаллы потока.
magnetics-flux-resonator=Заряжает кристаллы потока от сети. Пятая часть энергии теряется; модули, маяки и качество не помогают.
magnetics-magnetic-separator=Отделяет железную и медную руду от камня в ванне с феррожидкостью.
magnetics-magnetic-drill=Улучшение электробура: на 50% быстрее на той же площади 5×5.
magnetics-maglev-transport-belt=Самый быстрый конвейер: 75 предметов в секунду.
magnetics-maglev-underground-belt=75 предметов в секунду, наибольшая длина 13.
magnetics-maglev-splitter=Делит и сливает потоки маглев-конвейеров, 75 предметов в секунду.
magnetics-coil-capacitor=Накопитель 1×1: всего 1 МДж, зато отдаёт 1 МВт. Для пиковых нагрузок, например турелей.
magnetics-superconducting-accumulator=Вчетверо больше ёмкости и мощности, чем у аккумулятора, на тех же 2×2.
magnetics-superconducting-pylon=Дальность провода 48: на треть меньше опор на длинных линиях.
magnetics-mhd-generator=Превращает химическое топливо в 5,4 МВт без воды. Теряет десятую часть энергии топлива.
magnetics-flux-dynamo=Разряжает кристаллы потока: 10 МВт без загрязнения и без воды.
magnetics-geomagnetic-coil=Берёт энергию из магнитного поля планеты: небольшая постоянная мощность днём и ночью.
magnetics-ferrite-wall=Дешёвое раннее улучшение каменной стены.
magnetics-magnet-wall=Её поле бьёт током кусающих её жуков.
magnetics-superconducting-wall=Поглощает лазеры и молнии и бьёт током нападающих.
magnetics-magnet-gate=Ворота, прочные, как магнитная стена.
magnetics-superconducting-gate=Ворота, прочные, как сверхпроводящая стена.
magnetics-mend-coil=Чинит стены и турели в радиусе 10 клеток за счёт электросети, 5 кДж на единицу прочности.
magnetics-coilgun-turret=Электрическая турель: ферритовые болванки пробивают мелких врагов.
magnetics-gauss-turret=Дальнобойная турель, тяжёлые болванки которой пробивают броню.
magnetics-arc-emitter=Цепная молния перескакивает по стае и замедляет её.
magnetics-rail-cannon=Прошивает болванкой всех врагов на линии.

