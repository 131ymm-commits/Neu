[technology-description]
magnetics-ferrite-sintering=Спекание железной руды с камнем в феррит; ферритовые стены.
magnetics-electromagnetic-coils=Намотка медного кабеля на ферритовые сердечники.
magnetics-coilgun=Электрическая турель с пробивающими ферритовыми болванками.
magnetics-induction-smelting=Сплавление стали, феррита и меди в магнитный сплав.
magnetics-magnetic-mining=Более быстрое улучшение электробура на том же месте.
magnetics-magnetic-power=МГД-генератор, катушечный конденсатор и геомагнитная катушка.
magnetics-magnetic-separation=Феррожидкость и руда, извлечённая из камня.
magnetics-magnetic-fortifications=Магнитные стены и ворота, магнитные болванки, пушка Гаусса и ремонтная катушка.
magnetics-arc-emitter=Турель с цепной молнией против стай.
magnetics-superconductivity=Жидкий азот из воздуха и сверхпроводящий кабель.
magnetics-superconducting-power=Сверхпроводящие аккумуляторы и опоры.
magnetics-flux-energy=Выращивание и зарядка кристаллов потока; энергия туда, куда не дотянуть провода.
magnetics-maglev-logistics=Конвейеры, подземные конвейеры и разделители на 75 предметов в секунду.
magnetics-superconducting-defense=Сверхпроводящие стены и ворота и рельсовая пушка.

