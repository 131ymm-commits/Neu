magnetics-ferrofluid=Феррожидкость
magnetics-liquid-nitrogen=Жидкий азот

[fluid-description]
magnetics-ferrofluid=Феррит во взвеси лёгкой нефти. Смазка маглев-конвейеров и ванна магнитного сепаратора.
magnetics-liquid-nitrogen=Сжижается из воздуха в криокамере. Охлаждает сверхпроводники.

