[mod-name]
magnetics=Magnetics

[mod-description]
magnetics=Магнитная ветка технологий: феррит, катушки, магнитный сплав, сверхпроводящий кабель и кристаллы потока; 26 построек — от спекательной печи до маглев-конвейеров и рельсовой пушки.

