[entity-description]
magnetics-sintering-kiln=Burns fuel to sinter iron ore and stone into ferrite.
magnetics-induction-furnace=Electric furnace for ferrite and magnet alloy.
magnetics-coil-winder=Winds copper cable onto ferrite cores.
magnetics-cryo-chamber=Liquefies nitrogen from air, makes superconducting cable and grows flux crystals.
magnetics-flux-resonator=Charges flux crystals from the grid. A fifth of the energy is lost; modules, beacons and quality do not help.
magnetics-magnetic-separator=Separates iron and copper ore from stone in a ferrofluid bath.
magnetics-magnetic-drill=Upgrade of the electric mining drill: 50% faster on the same 5×5 area.
magnetics-maglev-transport-belt=The fastest belt: 75 items per second.
magnetics-maglev-underground-belt=75 items per second, maximum distance 13.
magnetics-maglev-splitter=Splits and merges maglev lanes at 75 items per second.
magnetics-coil-capacitor=1×1 storage: only 1 MJ, but moves 1 MW. For burst loads such as turrets.
magnetics-superconducting-accumulator=Four times the capacity and power of an accumulator on the same 2×2.
magnetics-superconducting-pylon=Wire reach 48: a third fewer poles on long lines.
magnetics-mhd-generator=Turns chemical fuel into 5.4 MW without water. Loses a tenth of the fuel energy.
magnetics-flux-dynamo=Discharges flux crystals: 10 MW with no pollution and no water.
magnetics-geomagnetic-coil=Draws power from the planet's magnetic field: a small, constant output by day and night.
magnetics-ferrite-wall=A cheap early upgrade of the stone wall.
magnetics-magnet-wall=Its field shocks the biters that bite it.
magnetics-superconducting-wall=Immune to laser and electric damage; its field shocks the biters that bite it.
magnetics-magnet-gate=A gate as strong as a magnet wall.
magnetics-superconducting-gate=A gate as strong as a superconducting wall.
magnetics-mend-coil=Uses grid power to repair walls, gates, turrets and radars within 10 tiles of the coil: 5 kJ per point of health.
magnetics-coilgun-turret=An electric turret firing ferrite slugs that pierce small enemies.
magnetics-gauss-turret=A long-range turret whose heavy slugs break armor.
magnetics-arc-emitter=Chain lightning that jumps through a swarm and slows it.
magnetics-rail-cannon=Fires a slug through every enemy on a line.

