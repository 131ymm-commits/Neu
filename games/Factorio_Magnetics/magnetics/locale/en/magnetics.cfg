[item-description]
magnetics-ferrite=Iron ore sintered with stone into a magnetic ceramic. The core of every coil.
magnetics-coil=Copper cable wound on a ferrite core. The universal part of magnetic machines.
magnetics-magnet-alloy=Steel, ferrite and copper fused by eddy currents. The base of blue-tier magnetic machines.
magnetics-superconducting-cable=Magnet alloy in a plastic sheath, frozen by liquid nitrogen. Carries current without loss.
magnetics-flux-crystal-uncharged=Charge it in a flux resonator. The flux dynamo returns it after use.
magnetics-flux-crystal=A charged crystal holding 100 MJ. Fuel for the flux dynamo and the core of flux rail slugs.
magnetics-ferrite-slug=Coilgun ammo. A slug pierces small enemies standing in a line.
magnetics-magnet-slug=Heavy coilgun ammo that keeps its punch against armor.
magnetics-gauss-slug=Gauss turret ammo: one heavy hit that ignores most armor.
magnetics-rail-slug=Rail cannon ammo. Hits every enemy on a 36-tile line.
magnetics-flux-rail-slug=A rail slug around a charged flux crystal: three shots with physical and electric damage.

[fluid-name]
magnetics-ferrofluid=Ferrofluid
magnetics-liquid-nitrogen=Liquid nitrogen

[fluid-description]
magnetics-ferrofluid=Ferrite suspended in light oil. The lubricant of maglev belts and the bath of the magnetic separator.
magnetics-liquid-nitrogen=Liquefied from air in the cryo chamber. Cools superconductors.

