[technology-description]
magnetics-ferrite-sintering=Sinter iron ore with stone into ferrite; ferrite walls.
magnetics-electromagnetic-coils=Wind copper cable on ferrite cores.
magnetics-coilgun=An electric turret with piercing ferrite slugs.
magnetics-induction-smelting=Fuse steel, ferrite and copper into magnet alloy.
magnetics-magnetic-mining=A faster in-place upgrade of the electric mining drill.
magnetics-magnetic-power=MHD generator, coil capacitor and geomagnetic coil.
magnetics-magnetic-separation=Ferrofluid, and ore recovered from stone.
magnetics-magnetic-fortifications=Magnet walls and gates, magnet slugs, the gauss turret and the mend coil.
magnetics-arc-emitter=A chain-lightning turret against swarms.
magnetics-superconductivity=Liquid nitrogen from air and superconducting cable.
magnetics-superconducting-power=Superconducting accumulators and pylons.
magnetics-flux-energy=Grow and charge flux crystals; carry power where poles cannot reach.
magnetics-maglev-logistics=Belts, undergrounds and splitters at 75 items per second.
magnetics-superconducting-defense=Superconducting walls and gates, and the rail cannon.

