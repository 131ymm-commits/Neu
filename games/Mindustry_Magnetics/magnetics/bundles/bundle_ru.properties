item.magnetics-magnet-alloy.name = Магнитный сплав
item.magnetics-magnet-alloy.description = Титан, сплавленный с кремнием в индукционном поле. Основа всех магнитных машин.
item.magnetics-superconductor.name = Сверхпроводник
item.magnetics-superconductor.description = Магнитный сплав в пластановой оболочке, охлаждённый криогенной жидкостью. Передаёт энергию без потерь на большие расстояния.
block.magnetics-induction-furnace.name = Индукционная печь
block.magnetics-induction-furnace.description = Сплавляет титан и кремний в магнитный сплав вихревыми токами.
block.magnetics-cryo-chamber.name = Криокамера
block.magnetics-cryo-chamber.description = Одевает магнитный сплав в пластан и замораживает криогенной жидкостью — получается сверхпроводник.
block.magnetics-mag-conveyor.name = Магнитная лента
block.magnetics-mag-conveyor.description = Перемещает предметы по магнитной дорожке. Быстрее титанового конвейера.
block.magnetics-magnet-wall.name = Магнитная стена
block.magnetics-magnet-wall.description = Прочнее титановой. Поле иногда отражает пули.
block.magnetics-magnet-wall-large.name = Большая магнитная стена
block.magnetics-magnet-wall-large.description = Прочнее титановой. Поле иногда отражает пули.
block.magnetics-gauss.name = Гаусс
block.magnetics-gauss.description = Пушка-катушка. Стреляет болванками из магнитного сплава или тория, пробивающими несколько целей. Большая дальность, медленная перезарядка.
block.magnetics-superconducting-node.name = Сверхпроводящий узел
block.magnetics-superconducting-node.description = Силовой узел с длинной сверхпроводящей связью.
block.magnetics-superconducting-battery.name = Сверхпроводящая батарея
block.magnetics-superconducting-battery.description = Хранит втрое больше энергии, чем большой аккумулятор.
