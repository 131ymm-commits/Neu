item.magnetics-ferrite.name = Феррит
item.magnetics-ferrite.description = Спечённый песок со свинцом. Дешёвый магнитный материал ранней игры.
item.magnetics-magnet-alloy.name = Магнитный сплав
item.magnetics-magnet-alloy.description = Титан, сплавленный с кремнием в индукционном поле. Основа всех магнитных машин.
item.magnetics-coil.name = Катушка
item.magnetics-coil.description = Медный провод на сердечнике из сплава. Идёт в генераторы, зенитки и юниты.
item.magnetics-superconductor.name = Сверхпроводник
item.magnetics-superconductor.description = Сплав в пластановой оболочке, охлаждённый криожидкостью. Ток без потерь.
item.magnetics-flux-crystal.name = Кристалл потока
item.magnetics-flux-crystal.description = Фазовая ткань, застывшая в сверхпроводящем поле. Топливо реактора и снаряд рельсотрона.
block.magnetics-sintering-kiln.name = Спекательная печь
block.magnetics-sintering-kiln.description = Спекает песок со свинцом в феррит.
block.magnetics-induction-furnace.name = Индукционная печь
block.magnetics-induction-furnace.description = Сплавляет титан и кремний в магнитный сплав вихревыми токами.
block.magnetics-coil-winder.name = Намоточный станок
block.magnetics-coil-winder.description = Наматывает медный провод на сердечник из сплава.
block.magnetics-cryo-chamber.name = Криокамера
block.magnetics-cryo-chamber.description = Одевает сплав в пластан и замораживает криожидкостью — получается сверхпроводник.
block.magnetics-flux-resonator.name = Резонатор потока
block.magnetics-flux-resonator.description = Замораживает фазовую ткань в сверхпроводящем поле — растит кристалл потока.
block.magnetics-magnetic-separator.name = Магнитный сепаратор
block.magnetics-magnetic-separator.description = Магнитами разбирает металлолом на медь, свинец и титан.
block.magnetics-magnetic-drill.name = Магнитный бур
block.magnetics-magnetic-drill.description = Бур с магнитным приводом. Быстрее лазерного, берёт торий.
block.magnetics-mag-conveyor.name = Магнитная лента
block.magnetics-mag-conveyor.description = Перемещает предметы по магнитной дорожке. Быстрее титанового конвейера.
block.magnetics-mag-junction.name = Магнитный перекрёсток
block.magnetics-mag-junction.description = Пропускает два потока крест-накрест.
block.magnetics-mag-router.name = Магнитный разветвитель
block.magnetics-mag-router.description = Раздаёт предметы во все стороны.
block.magnetics-mag-bridge.name = Магнитный мост
block.magnetics-mag-bridge.description = Перебрасывает предметы на 8 клеток над препятствиями.
block.magnetics-coil-battery.name = Катушечный аккумулятор
block.magnetics-coil-battery.description = Маленький аккумулятор: 4000 единиц.
block.magnetics-superconducting-battery.name = Сверхпроводящая батарея
block.magnetics-superconducting-battery.description = Хранит втрое больше большого аккумулятора.
block.magnetics-superconducting-node.name = Сверхпроводящий узел
block.magnetics-superconducting-node.description = Силовой узел со связью на 22 блока.
block.magnetics-mhd-generator.name = МГД-генератор
block.magnetics-mhd-generator.description = Прогоняет плазму пиратита через поле катушек. 840 энергии в секунду.
block.magnetics-flux-dynamo.name = Реактор потока
block.magnetics-flux-dynamo.description = Медленно разряжает кристалл потока. 3600 энергии в секунду, не взрывается.
block.magnetics-ferrite-wall.name = Ферритовая стена
block.magnetics-ferrite-wall.description = Дешёвая стена ранней игры.
block.magnetics-ferrite-wall-large.name = Большая ферритовая стена
block.magnetics-ferrite-wall-large.description = Дешёвая стена ранней игры.
block.magnetics-magnet-wall.name = Магнитная стена
block.magnetics-magnet-wall.description = Прочнее титановой. Поле иногда отражает пули.
block.magnetics-magnet-wall-large.name = Большая магнитная стена
block.magnetics-magnet-wall-large.description = Прочнее титановой. Поле иногда отражает пули.
block.magnetics-superconducting-wall.name = Сверхпроводящая стена
block.magnetics-superconducting-wall.description = Поглощает лазеры и молнии, не проводит ток.
block.magnetics-superconducting-wall-large.name = Большая сверхпроводящая стена
block.magnetics-superconducting-wall-large.description = Поглощает лазеры и молнии, не проводит ток.
block.magnetics-mend-coil.name = Ремонтная катушка
block.magnetics-mend-coil.description = Индукцией чинит постройки в радиусе 11 блоков.
block.magnetics-magnetic-shield.name = Магнитный щит
block.magnetics-magnetic-shield.description = Силовой купол, который выдерживает больше, чем обычный.
block.magnetics-coilgun.name = Катушечник
block.magnetics-coilgun.description = Маленькая пушка-катушка ранней игры. Ферритовые болты пробивают двух врагов.
block.magnetics-gauss.name = Гаусс
block.magnetics-gauss.description = Пушка-катушка. Болванки пробивают три цели. Большая дальность, медленная перезарядка.
block.magnetics-arc-emitter.name = Разрядник
block.magnetics-arc-emitter.description = Бьёт наземные цели ветвистой молнией. Нужна только энергия.
block.magnetics-maglev-flak.name = Маглев-зенитка
block.magnetics-maglev-flak.description = Скорострельная зенитка: разгоняет катушки магнитом и рвёт их у цели.
block.magnetics-railgun.name = Рельсотрон
block.magnetics-railgun.description = Сверхпроводящие рельсы, один выстрел раз в 3,5 с — прошивает всё на линии.
block.magnetics-magnet-factory.name = Магнитный завод
block.magnetics-magnet-factory.description = Собирает летающие магнитные машины: Искру, Индуктор и Магнетар.
unit.magnetics-spark.name = Искра
unit.magnetics-spark.description = Лёгкий магнитный истребитель. Болты пробивают двух врагов.
unit.magnetics-inductor.name = Индуктор
unit.magnetics-inductor.description = Ремонтник: чинит постройки болтами, добывает и строит.
unit.magnetics-magnetar.name = Магнетар
unit.magnetics-magnetar.description = Тяжёлый ганшип с двумя пушками Гаусса.
