item.magnetics-magnet-alloy.name = Magnet Alloy
item.magnetics-magnet-alloy.description = Titanium alloyed with silicon in an induction field. Base of every magnetic machine.
item.magnetics-superconductor.name = Superconductor
item.magnetics-superconductor.description = Magnet alloy in a plastanium sheath, cooled by cryofluid. Carries power without loss over long distances.
block.magnetics-induction-furnace.name = Induction Furnace
block.magnetics-induction-furnace.description = Fuses titanium and silicon into magnet alloy with eddy currents.
block.magnetics-cryo-chamber.name = Cryo Chamber
block.magnetics-cryo-chamber.description = Wraps magnet alloy in plastanium and freezes it with cryofluid into superconductor.
block.magnetics-mag-conveyor.name = Mag Conveyor
block.magnetics-mag-conveyor.description = Carries items on a magnetic track. Faster than the titanium conveyor.
block.magnetics-magnet-wall.name = Magnet Wall
block.magnetics-magnet-wall.description = Tougher than titanium. Its field sometimes deflects bullets.
block.magnetics-magnet-wall-large.name = Large Magnet Wall
block.magnetics-magnet-wall-large.description = Tougher than titanium. Its field sometimes deflects bullets.
block.magnetics-gauss.name = Gauss
block.magnetics-gauss.description = A coilgun. Fires magnet alloy or thorium slugs that pierce several targets. Long range, slow reload.
block.magnetics-superconducting-node.name = Superconducting Node
block.magnetics-superconducting-node.description = A power node with a long superconducting link.
block.magnetics-superconducting-battery.name = Superconducting Battery
block.magnetics-superconducting-battery.description = Stores three times as much power as a large battery.
