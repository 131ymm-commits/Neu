item.magnetics-ferrite.name = Ferrite
item.magnetics-ferrite.description = Sand sintered with lead. A cheap early magnetic material.
item.magnetics-magnet-alloy.name = Magnet Alloy
item.magnetics-magnet-alloy.description = Titanium fused with silicon in an induction field. Base of every magnetic machine.
item.magnetics-coil.name = Coil
item.magnetics-coil.description = Copper wire on an alloy core. Used in generators, flak and units.
item.magnetics-superconductor.name = Superconductor
item.magnetics-superconductor.description = Alloy in a plastanium sheath, cooled by cryofluid. Current without loss.
item.magnetics-flux-crystal.name = Flux Crystal
item.magnetics-flux-crystal.description = Phase fabric frozen in a superconducting field. Reactor fuel and railgun ammo.
block.magnetics-sintering-kiln.name = Sintering Kiln
block.magnetics-sintering-kiln.description = Sinters sand and lead into ferrite.
block.magnetics-induction-furnace.name = Induction Furnace
block.magnetics-induction-furnace.description = Fuses titanium and silicon into magnet alloy with eddy currents.
block.magnetics-coil-winder.name = Coil Winder
block.magnetics-coil-winder.description = Winds copper wire onto an alloy core.
block.magnetics-cryo-chamber.name = Cryo Chamber
block.magnetics-cryo-chamber.description = Sheathes alloy in plastanium and freezes it with cryofluid into superconductor.
block.magnetics-flux-resonator.name = Flux Resonator
block.magnetics-flux-resonator.description = Freezes phase fabric in a superconducting field, growing flux crystals.
block.magnetics-magnetic-separator.name = Magnetic Separator
block.magnetics-magnetic-separator.description = Sorts scrap into copper, lead and titanium with magnets.
block.magnetics-magnetic-drill.name = Magnetic Drill
block.magnetics-magnetic-drill.description = A drill with a magnetic drive. Faster than the laser drill, mines thorium.
block.magnetics-mag-conveyor.name = Mag Conveyor
block.magnetics-mag-conveyor.description = Moves items along a magnetic track. Faster than the titanium conveyor.
block.magnetics-mag-junction.name = Mag Junction
block.magnetics-mag-junction.description = Passes two item streams across each other.
block.magnetics-mag-router.name = Mag Router
block.magnetics-mag-router.description = Distributes items to all sides.
block.magnetics-mag-bridge.name = Mag Bridge
block.magnetics-mag-bridge.description = Carries items over obstacles for 8 tiles.
block.magnetics-coil-battery.name = Coil Battery
block.magnetics-coil-battery.description = A small battery: 4000 units.
block.magnetics-superconducting-battery.name = Superconducting Battery
block.magnetics-superconducting-battery.description = Stores three times as much as a large battery.
block.magnetics-superconducting-node.name = Superconducting Node
block.magnetics-superconducting-node.description = A power node linking up to 22 tiles.
block.magnetics-mhd-generator.name = MHD Generator
block.magnetics-mhd-generator.description = Drives pyratite plasma through a coil field. 840 power per second.
block.magnetics-flux-dynamo.name = Flux Reactor
block.magnetics-flux-dynamo.description = Slowly discharges flux crystals. 3600 power per second, never explodes.
block.magnetics-ferrite-wall.name = Ferrite Wall
block.magnetics-ferrite-wall.description = A cheap early wall.
block.magnetics-ferrite-wall-large.name = Large Ferrite Wall
block.magnetics-ferrite-wall-large.description = A cheap early wall.
block.magnetics-magnet-wall.name = Magnet Wall
block.magnetics-magnet-wall.description = Tougher than titanium. Its field sometimes deflects bullets.
block.magnetics-magnet-wall-large.name = Large Magnet Wall
block.magnetics-magnet-wall-large.description = Tougher than titanium. Its field sometimes deflects bullets.
block.magnetics-superconducting-wall.name = Superconducting Wall
block.magnetics-superconducting-wall.description = Absorbs lasers and lightning, does not conduct power.
block.magnetics-superconducting-wall-large.name = Large Superconducting Wall
block.magnetics-superconducting-wall-large.description = Absorbs lasers and lightning, does not conduct power.
block.magnetics-mend-coil.name = Mend Coil
block.magnetics-mend-coil.description = Repairs buildings within 11 tiles by induction.
block.magnetics-magnetic-shield.name = Magnetic Shield
block.magnetics-magnetic-shield.description = A force dome that takes more punishment than the standard one.
block.magnetics-coilgun.name = Coilgun
block.magnetics-coilgun.description = A small early coil cannon. Ferrite bolts pierce two enemies.
block.magnetics-gauss.name = Gauss
block.magnetics-gauss.description = A coilgun. Slugs pierce three targets. Long range, slow reload.
block.magnetics-arc-emitter.name = Arc Emitter
block.magnetics-arc-emitter.description = Strikes ground targets with branching lightning. Needs only power.
block.magnetics-maglev-flak.name = Maglev Flak
block.magnetics-maglev-flak.description = A rapid anti-air gun: launches coils magnetically and bursts them near targets.
block.magnetics-railgun.name = Railgun
block.magnetics-railgun.description = Superconducting rails; one shot every 3.5 s pierces everything in line.
block.magnetics-magnet-factory.name = Magnet Factory
block.magnetics-magnet-factory.description = Builds magnetic aircraft: Spark, Inductor and Magnetar.
unit.magnetics-spark.name = Spark
unit.magnetics-spark.description = A light magnetic fighter. Bolts pierce two enemies.
unit.magnetics-inductor.name = Inductor
unit.magnetics-inductor.description = A support craft: heals buildings with bolts, mines and builds.
unit.magnetics-magnetar.name = Magnetar
unit.magnetics-magnetar.description = A heavy gunship with twin gauss cannons.
